packages:
  - apps/*
  - shared
  - mocks
peerDependencyRules:
  allowedVersions:
    # firebase-functions (and firebase-functions-test) still reference firebase-admin 13 and below
    firebase-admin: "14"
allowBuilds:
  '@firebase/util': true
  '@google/genai': false
  esbuild: true
  protobufjs: true
  unrs-resolver: true
