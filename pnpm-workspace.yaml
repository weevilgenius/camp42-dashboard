packages:
  - apps/*
  - shared
  - mocks
permissions:
  '@firebase/util':
    build: true
  '@google/genai':
    build: false # postinstall hook is a noop placeholder
  esbuild:
    build: true
  protobufjs:
    build: true
  unrs-resolver:
    build: true
autoDedupe: true
saveTypes: true
peerDependencyRules:
  allowedVersions:
    # suppress peer warnings from lit about @types/node
    "@lit-labs/ssr>@types/node": ">=20"
lockfile:
  includeResolutionSettings: true
